name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/python-shim"
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$RUNNER_TEMP/python-shim/python3"
          chmod +x "$RUNNER_TEMP/python-shim/python3"
          printf '%s\n' "$RUNNER_TEMP/python-shim" >> "$GITHUB_PATH"
      - run: ./scripts/test --portable-only
  rust:
    name: Rust helper (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Test and lint helper
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
        run: |
          cargo fmt --manifest-path skills/omarchy-app-scaffold/scripts/app-tool/Cargo.toml -- --check
          cargo test --locked --manifest-path skills/omarchy-app-scaffold/scripts/app-tool/Cargo.toml
          cargo clippy --locked --manifest-path skills/omarchy-app-scaffold/scripts/app-tool/Cargo.toml --all-targets -- -D warnings
  required:
    name: CI / Required
    if: always()
    needs: [portable, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          PORTABLE: ${{ needs.portable.result }}
          RUST: ${{ needs.rust.result }}
        run: test "$PORTABLE" = success && test "$RUST" = success
